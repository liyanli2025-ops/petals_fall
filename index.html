<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>局部地区有花雨</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 启动引导页 -->
  <div id="landing" class="landing">
    <!-- 视频背景 -->
    <video class="landing-video" autoplay muted loop playsinline>
      <source src="https://mat1.gtimg.com/qqcdn/redian/petals_fall_test/start.mp4" type="video/mp4">
    </video>
    <!-- 遮罩层 -->
    <div class="landing-overlay"></div>
    <!-- 内容层 -->
    <div class="landing-content">
      <!-- 标题Logo -->
      <img class="landing-logo" src="logo1.png" alt="局部地区有花雨">
      <p class="landing-subtitle">AR 沉浸花瓣体验</p>
      <p class="landing-desc">开启摄像头，沉浸在漫天花瓣之中<br>转动设备，感受 360° 环绕花海</p>
      <button id="btn-start" class="btn-start">开始体验</button>
      <p class="landing-tip">需要授权摄像头和陀螺仪权限</p>
      <p id="debug-info" class="debug-info"></p>
    </div>
  </div>

  <!-- 主场景 — 单WebGL架构（避免多context被浏览器回收） -->
  <div id="scene" class="scene hidden">
    <!-- 层级从后到前：
      1. 摄像头视频 / 降级背景
      2. 花瓣层（单WebGL，所有远/中/近花瓣）
      3. 人物遮罩层（人体轮廓覆盖在花瓣之上）
      4. UI 控制层
    -->
    <video id="camera-video" autoplay playsinline muted></video>
    <div id="fallback-bg" class="fallback-bg hidden"></div>

    <!-- 隐藏的 WebGL 渲染目标（单 context） -->
    <canvas id="canvas-petals" style="display:none;"></canvas>
    <!-- 远景花瓣（2D，CSS blur） -->
    <canvas id="canvas-far" class="petal-layer layer-far"></canvas>
    <!-- 中景花瓣（2D，清晰） -->
    <canvas id="canvas-mid" class="petal-layer layer-mid"></canvas>
    <!-- 人物遮罩（摄像头画面中人物部分的复制，遮挡花瓣） -->
    <canvas id="canvas-person" class="person-layer"></canvas>
    <!-- 近景花瓣（2D，CSS blur） -->
    <canvas id="canvas-near" class="petal-layer layer-near"></canvas>

    <!-- UI -->
    <div id="ui-overlay" class="ui-overlay">
      <div class="ui-btn-wrap">
        <button id="btn-switch-camera" class="ui-btn" title="翻转">
          <!-- 环绕相机的旋转箭头 -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <!-- 相机机身 -->
            <rect x="5" y="9" width="14" height="10" rx="2"/>
            <!-- 相机顶部凸起 -->
            <path d="M9 9V7.5a1 1 0 011-1h4a1 1 0 011 1V9"/>
            <!-- 镜头 -->
            <circle cx="12" cy="14" r="2.5"/>
            <!-- 左上弧形箭头 -->
            <path d="M3.5 11A9.5 9.5 0 0112 2.5" stroke-width="1.6"/>
            <path d="M12 2.5l-2.2 1.5M12 2.5l-1.2-2.2" stroke-width="1.6"/>
            <!-- 右下弧形箭头 -->
            <path d="M20.5 13A9.5 9.5 0 0112 21.5" stroke-width="1.6"/>
            <path d="M12 21.5l2.2-1.5M12 21.5l1.2 2.2" stroke-width="1.6"/>
          </svg>
        </button>
        <span class="ui-btn-label">翻转</span>
      </div>
      <!-- 拍照按钮 -->
      <div class="ui-btn-wrap">
        <button id="btn-photo" class="ui-btn ui-btn-capture" title="拍照">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
          </svg>
        </button>
        <span class="ui-btn-label">拍照</span>
      </div>
      <!-- 录像按钮 -->
      <div class="ui-btn-wrap">
        <button id="btn-record" class="ui-btn ui-btn-capture" title="录像">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="12" r="5" fill="#e53935" class="record-dot"/>
          </svg>
        </button>
        <span class="ui-btn-label">录像</span>
      </div>
      <div id="petal-count-control" class="petal-control">
        <label>花瓣密度</label>
        <input type="range" id="petal-density" min="200" max="5000" value="3000" step="50">
      </div>
    </div>
    <div id="fps-counter" class="fps-counter"></div>
    <div id="debug-panel" class="debug-panel" style="display:none;position:fixed;top:40px;left:8px;background:rgba(0,0,0,0.75);color:#0f0;font:11px/1.4 monospace;padding:8px 10px;border-radius:6px;z-index:9999;pointer-events:none;white-space:pre;max-width:90vw;"></div>
    <!-- 录像计时 -->
    <div id="record-time" class="record-time hidden">00:00</div>
    <!-- 拍照闪光 -->
    <div id="capture-flash" class="capture-flash"></div>
    <!-- 提示 -->
    <div id="capture-toast" class="capture-toast"></div>
  </div>

  <!-- Three.js r149（本地） -->
  <script src="libs/three.min.js"></script>
  <!-- MediaPipe Selfie Segmentation（本地） -->
  <script src="libs/mediapipe/selfie_segmentation.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/segmentation.js"></script>
  <script src="js/body-collision.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/gyroscope.js"></script>
  <script src="js/webgl-blur.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
